name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancel superseded runs on the same branch. Pushing three times in a minute
# otherwise queues three full pipelines, and the first two are already irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # THE MONOREPO PIECE.
  #
  # This job decides which apps a commit actually touched, and the jobs below run
  # only if their app changed. Without it, editing one line in the mobile app runs
  # the full Next.js build — and a CI that punishes you for touching an unrelated
  # app is a CI people start skipping.
  #
  # Note `packages/**` appears in BOTH filters. Shared code affects both apps, so
  # changing it must run both. That is the whole reason this cannot be inferred
  # from the directory name alone.
  # ---------------------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      customer: ${{ steps.filter.outputs.customer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            customer:
              - 'apps/customer/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

  web:
    name: Web — typecheck, lint, test, build, HTML contract
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Caches from the ROOT lockfile, which is the only one in a workspace.
          cache: npm

      # Installs the whole workspace, not just apps/web. npm workspaces resolve
      # from the root, and `npm ci --workspace=web` would still need the root tree.
      - run: npm ci

      # ---------------------------------------------------------------------
      # THE TOKEN GUARD, and it belongs here rather than in its own job.
      #
      # packages/tokens is the single source of the palette for web, the customer
      # app and (later) the driver app. apps/web/src/app/tokens.generated.css is
      # generated FROM it and checked in, so the web app needs no build step — and
      # a checked-in generated file is only a single source of truth for as long as
      # somebody remembers to regenerate it.
      #
      # It runs in the web job because the `web` filter above already matches
      # exactly the two paths that can make the file stale: `packages/**` (the
      # source changed) and `apps/web/**` (the generated file was hand-edited).
      # A separate job would need a third `npm ci` — about 40 seconds — to run two
      # commands that take under one.
      #
      # FIRST, before typecheck and build, so a stale palette fails in seconds
      # instead of after a full Next.js compile.
      #
      # The package's own typecheck is here too, because nothing else covers it:
      # apps/web imports src/index.ts so TypeScript checks that transitively, but
      # src/css.ts and bin/generate.ts are imported by neither app. A broken
      # generator would have gone unnoticed until someone ran it by hand.
      # ---------------------------------------------------------------------
      - name: Tokens — typecheck the source
        run: npm run typecheck --workspace=@chowk/tokens

      - name: Tokens — generated CSS is current
        run: npm run check --workspace=@chowk/tokens

      # Proves the mapping is CORRECT, not merely current. `check` above compares the
      # checked-in file against the generator; regenerate a wrong Tailwind radius
      # table and the check goes green while every corner in the app reshapes.
      - name: Tokens — unit tests
        run: npm run test --workspace=@chowk/tokens

      - name: Typecheck
        run: npm run typecheck --workspace=web

      # --max-warnings=0 on purpose. A warning nobody has to fix becomes a warning
      # nobody reads, and then an error hides among forty of them.
      - name: Lint
        run: npm run lint --workspace=web

      # Unit tests BEFORE the build: they run in under a second and cover the pure
      # logic where a mistake is silent — money formatting, the offer index, and the
      # location cookie, which is untrusted client-writable input.
      - name: Unit tests
        run: npm run test --workspace=web

      - name: Build
        run: npm run build --workspace=web

      # -----------------------------------------------------------------------
      # THE RENDERED-DOCUMENT CONTRACT, against a real `next start`.
      #
      # Every structural bug this page actually had was invisible to a component
      # test: removing the hero removed the page's only h1; adding it back created a
      # second one; the h1 arrived in the byte stream after four h2 elements because
      # it sat behind a Suspense boundary; and five sections once shipped at
      # opacity:0, so the page read as empty without JavaScript. None of those is a
      # property of a component — they are properties of the assembled document.
      #
      # NO BACKEND NEEDED, and that is checked rather than assumed: with Postgres
      # stopped the page still returns 200 with exactly one h1, because the hero is
      # awaited directly and never calls the API. So this runs without standing up
      # the Go service and a database from another repository.
      #
      # WHAT THIS DOES NOT COVER, stated plainly: the kitchen cards themselves. Those
      # assertions are gated behind E2E_WITH_DATA and do not run here. CI proves the
      # SHAPE of the page, not that it has food on it. Closing that gap means running
      # the backend as a CI service — worth doing, and not done yet.
      # -----------------------------------------------------------------------
      - name: Rendered HTML contract
        run: |
          npm run start --workspace=web > /tmp/next.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://localhost:3000/; then
            echo "::error::next start never became ready"; cat /tmp/next.log; exit 1
          fi
          E2E_BASE_URL=http://localhost:3000 npm run test --workspace=web

  customer:
    name: Customer app — typecheck, lint, test
    needs: changes
    if: needs.changes.outputs.customer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=customer

      - name: Lint
        run: npm run lint --workspace=customer

      # Pure modules only — the per-platform API host resolution, which is the single
      # most commonly botched thing when moving from web to mobile and whose every
      # failure mode reads as "Network request failed". Two of them already happened:
      # images 404'd because they are served on :3000 and not by the API on :8080,
      # and `localhost` on a real device means the device.
      #
      # No component rendering: that needs a native preset, and the renderer would
      # not run the Reanimated worklets that ARE the behaviour on that screen. It
      # would assert a View exists while the animation — the part that broke four
      # times this week — stayed invisible to it.
      - name: Unit tests
        run: npm run test --workspace=customer

      # NO native build here, deliberately. Compiling an iOS or Android binary
      # needs a macOS runner or the Android SDK and takes 15+ minutes — that
      # belongs on a release trigger, via EAS Build, not on every push.

  # Branch protection can require this single check instead of listing every job,
  # which means adding an app later does not mean editing the protection rules.
  # `always()` matters: without it a skipped dependency makes this skip too, and a
  # skipped required check blocks the merge forever.
  ci:
    name: CI
    needs: [web, customer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed or were skipped."
